site_name: DWS Apunteak - 2025-2026
theme:
  name: material
  language: eu
  logo: images/logo.png
  favicon: http://fptxurdinaga.eus/wp-content/uploads/2022/10/favicon-96x96-1.png
palette:
- scheme: default
  primary: '#004c95'
  accent: '#e95f15'
- scheme: slate
  primary: '#004c95'
  accent: '#e95f15'
  toggle:
    icon: material/weather-night
    name: Modu iluna
extra_css:
- stylesheets/extra.css
extra_javascript:
- scripts/checkboxes.js
plugins:
- search
markdown_extensions:
- admonition
- pymdownx.tasklist:          # ← nuevo
    clickable_checkbox: true  #  hace los checkboxes interactivos
    custom_checkbox: true     #  usa los iconos de Material
- toc:
    permalink: true
- footnotes
- tables
nav:
- Hasiera: index.md
