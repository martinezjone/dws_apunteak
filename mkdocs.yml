site_name: DWS Apunteak - 2025-2026
theme:
  name: material
  language: eu
  logo: https://fptxurdinaga.eus/wp-content/uploads/2023/06/Logo_Home3.png
  favicon: http://fptxurdinaga.eus/wp-content/uploads/2022/10/favicon-96x96-1.png
palette:
- scheme: default
  primary: '#005A9C'
  accent: '#FF8200'
- scheme: slate
  primary: '#005A9C'
  accent: '#FF8200'
  toggle:
    icon: material/weather-night
    name: Modu iluna
extra_css:
- stylesheets/extra.css
plugins:
- search
markdown_extensions:
- admonition
- pymdownx.tasklist:          # ← nuevo
    clickable_checkbox: true  #  hace los checkboxes interactivos
    custom_checkbox: true     #  usa los iconos de Material
- toc:
    permalink: true
- footnotes
- tables
