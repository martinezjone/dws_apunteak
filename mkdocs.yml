  - 1. Aldagaiak eta adierazpenak: 02-sintaxia/dws-2-unitatea-aldagaiak-eta-adierazpenak/index.md
  - 2. PHP Elementuak: 02-sintaxia/dws-2-unitatea-php-elementuak/index.md
  - 3. Kontrol egiturak: 02-sintaxia/dws-2-unitatea-kontrol-egiturak/index.md
